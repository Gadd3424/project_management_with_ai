name: evolutionary-project-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: project_ai
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d project_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: ["${ENV_FILE:-.env}"]
    command: sh -c "alembic upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: ["${ENV_FILE:-.env}"]
    command: celery -A apps.worker.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model-artifacts:/app/artifacts

  inference:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: ["${ENV_FILE:-.env}"]
    command: uvicorn services.inference.main:app --host 0.0.0.0 --port 8001
    volumes:
      - model-artifacts:/app/artifacts:ro

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000/api/v1
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on: [api]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  postgres-data:
  redis-data:
  minio-data:
  model-artifacts:
  mlflow-data:
