[project]
name = "evolutionary-project-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
  "celery[redis]>=5.5,<6",
  "redis>=6,<7",
  "numpy>=2.2,<3",
  "safetensors>=0.5,<1",
  "structlog>=25,<26",
  "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "packages*"]
exclude = ["tests*", "work*", "outputs*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]
ml = [
  "scikit-learn>=1.7,<2",
  "sentence-transformers>=5,<6",
  "torch>=2.7,<3",
  "transformers>=4.54,<5",
  "peft>=0.17,<1",
  "mlflow>=3.2,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
